name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Gradle 9.5 + gradle-daemon-jvm.properties(toolchainVersion=25) 要求 JDK 25
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Secrets 缺省时跳过,回退 debug 签名
    - name: Inject release signing from secrets
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
        fi

    - name: Build APKs and run unit tests
      run: ./gradlew assembleDebug assembleRelease testDebugUnitTest --stacktrace

    # if: always() —— 测试失败时也能下载到已编出的 APK 排查
    - name: Upload debug APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: llm-usage-debug-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload release APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: llm-usage-release-apk
        path: app/build/outputs/apk/release/*.apk
